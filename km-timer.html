<meta name="claude:viewport-fit-sides" content="cover">
<title>Pranava Timer</title>
<style>
  /* Layout: one calm column — a Flower-of-Life night sky behind a time dial, duration chips, one begin control. */
  :root{
    --bg0:#14102a; --bg1:#221743; --bg2:#2c1f56;
    --violet:#8b74c8; --violet-soft:#b9a7e6;
    --beige:#e9dcc6; --beige-dim:#c9bda9; --sky:#a5cbe8;
    --ink:#efeaf7; --ink-dim:#9d94b8;
    --card:rgba(185,167,230,.055); --line:rgba(185,167,230,.13); --gold:#C09040;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%, var(--bg2) 0%, var(--bg1) 45%, var(--bg0) 100%) fixed var(--bg0);
    -webkit-tap-highlight-color:transparent;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}

  #bg-flower{position:fixed;inset:0;z-index:-1;overflow:hidden;display:flex;align-items:center;justify-content:center;
    color:var(--violet-soft);opacity:.055;pointer-events:none}
  #bg-flower svg{width:135vmax;height:135vmax;flex:none;animation:slowspin 240s linear infinite}
  @keyframes slowspin{to{transform:rotate(360deg)}}

  .app{max-width:560px;margin:0 auto;min-height:100%;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:22px 40px;
    display:flex;flex-direction:column;align-items:center;gap:6px}

  header{text-align:center;margin-bottom:2px}
  .logo{width:46px;height:auto;display:block;margin:0 auto 4px;filter:drop-shadow(0 0 14px rgba(233,220,198,.35))}
  h1{font-family:var(--serif);font-weight:400;font-size:1.3rem;letter-spacing:.55em;text-indent:.55em;color:var(--beige);margin:0}
  .eyebrow{font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim);margin-top:8px}

  /* time dial */
  .wrap{position:relative;width:min(70vw,280px);aspect-ratio:1;margin:18px auto 6px}
  .dial{position:absolute;inset:0;color:var(--violet-soft);filter:drop-shadow(0 0 20px rgba(139,116,200,.35));
    transition:transform 4s cubic-bezier(.4,0,.6,1)}
  .dial svg{width:100%;height:100%}
  .prog{transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 6px rgba(233,220,198,.55))}
  .ripple{position:absolute;inset:6%;border:1px solid var(--violet-soft);border-radius:50%;opacity:0;pointer-events:none;
    animation:ripple 12s ease-out infinite}
  .ripple.d2{animation-delay:4s}.ripple.d3{animation-delay:8s}
  @keyframes ripple{0%{transform:scale(.985);opacity:.3}70%{opacity:.06}100%{transform:scale(1.22);opacity:0}}
  .breathe{animation:breathe 10s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.988)}50%{transform:scale(1.014)}}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;text-align:center}
  .time{font-family:var(--serif);font-size:3.1rem;color:var(--beige);text-shadow:0 0 22px rgba(233,220,198,.4);
    font-variant-numeric:tabular-nums;line-height:1}
  .state{font-size:.64rem;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-dim);margin-top:8px;min-height:1em}

  /* duration chips */
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0 4px}
  .chip{border:1px solid var(--line);background:rgba(185,167,230,.05);color:var(--ink-dim);
    padding:8px 15px;border-radius:999px;font-size:.85rem;cursor:pointer;transition:.2s;font-family:var(--sans)}
  .chip small{font-size:.68em;opacity:.8;margin-left:2px}
  .chip.active{color:var(--bg0);background:var(--beige);border-color:var(--beige);font-weight:600;
    box-shadow:0 4px 18px rgba(233,220,198,.28)}
  .chip-input{width:74px;background:var(--bg1);border:1px solid var(--violet-soft);border-radius:999px;color:var(--beige);
    padding:8px 10px;font-size:.85rem;text-align:center;outline:none;font-family:var(--sans)}

  /* controls */
  .controls{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
  .begin{width:100%;padding:16px;font-size:.92rem;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;
    color:var(--bg0);background:linear-gradient(135deg,#f0e5cf,#d5bf97);border:none;border-radius:999px;cursor:pointer;
    font-weight:600;box-shadow:0 10px 36px rgba(233,220,198,.22);transition:transform .2s;font-family:var(--sans)}
  .begin:active{transform:scale(.98)}
  .run-row{display:flex;gap:10px;width:100%}
  .ghost{flex:1;background:none;border:1px solid var(--line);color:var(--violet-soft);padding:13px 16px;border-radius:999px;
    font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;font-family:var(--sans);transition:.2s}
  .ghost:active{transform:scale(.98)}

  /* sounds trigger — sits above Begin as the first step; faintly filled so it reads softer than Begin */
  .soundsbtn{width:100%;background:rgba(233,220,198,.12);border:1px solid rgba(233,220,198,.28);color:var(--beige);
    padding:14px;border-radius:999px;font-size:.72rem;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    cursor:pointer;font-family:var(--sans);font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
  .soundsbtn:active{transform:scale(.98)}
  .soundsbtn:hover{background:rgba(233,220,198,.18)}
  .soundsbtn .dot{font-size:1rem;line-height:1;color:var(--beige);text-indent:0}

  /* slide-up sounds sheet (bottom sheet on phone, centered card on laptop) */
  .sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(10,7,24,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet.show{opacity:1;pointer-events:auto}
  .panel{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
    background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line);border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:6px 20px calc(22px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);transition:transform .3s cubic-bezier(.3,0,.2,1);
    box-shadow:0 -24px 60px rgba(0,0,0,.45)}
  .sheet.show .panel{transform:translateY(0)}
  .grab{width:40px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 2px}
  .panel h2{font-family:var(--serif);font-weight:400;font-size:1rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--beige);text-align:center;margin:4px 0 2px}
  .row small{display:block;font-size:.68em;letter-spacing:0;text-transform:none;opacity:.55;margin-top:2px}
  .donebtn{width:100%;margin-top:16px;padding:14px;font-size:.78rem;letter-spacing:.4em;text-indent:.4em;
    text-transform:uppercase;color:var(--bg0);background:linear-gradient(135deg,#f0e5cf,#d5bf97);border:none;
    border-radius:999px;cursor:pointer;font-weight:600;font-family:var(--sans)}
  .donebtn:active{transform:scale(.98)}
  @media(min-width:520px){
    .sheet{align-items:center}
    .panel{border-radius:26px;border-bottom:1px solid var(--line);padding-bottom:22px;transform:translateY(18px);opacity:0;
      transition:transform .3s cubic-bezier(.3,0,.2,1),opacity .25s}
    .sheet.show .panel{transform:translateY(0);opacity:1}
    .grab{display:none}
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;font-size:.86rem}
  .row+.row{border-top:1px solid var(--line)}
  .row span{color:var(--ink-dim)}
  select{background:rgba(20,16,42,.55);color:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:7px 10px;font-size:.82rem;font-family:var(--sans)}
  input[type=range]{accent-color:var(--violet);width:52%;max-width:200px}
  .switch{appearance:none;width:42px;height:24px;border-radius:999px;background:rgba(185,167,230,.18);
    border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--ink-dim);transition:.2s}
  .switch:checked{background:rgba(233,220,198,.35)}
  .switch:checked::after{left:21px;background:var(--beige)}

  footer{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;opacity:.9}
  footer svg{width:42px;height:42px}
  footer span{font-size:.6rem;letter-spacing:.16em;line-height:1.8;color:var(--ink-dim);text-transform:uppercase}
  footer b{color:var(--gold);font-weight:600}

  button:focus-visible,select:focus-visible,.chip:focus-visible,.switch:focus-visible{outline:2px solid var(--sky);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    #bg-flower svg,.breathe{animation:none}
    .ripple{animation:none;opacity:0}
  }
</style>

<div id="bg-flower"></div>

<div class="app">
  <header>
    <svg class="logo" viewBox="56 36 144 176" aria-hidden="true">
      <defs><linearGradient id="hp" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f4e8d0"/><stop offset="100%" stop-color="#cfa96e"/></linearGradient></defs>
      <g transform="rotate(-56 128 158)" opacity=".5"><path d="M128 88 C140 110 140 138 128 158 C116 138 116 110 128 88 Z" fill="url(#hp)"/></g>
      <g transform="rotate(56 128 158)" opacity=".5"><path d="M128 88 C140 110 140 138 128 158 C116 138 116 110 128 88 Z" fill="url(#hp)"/></g>
      <g transform="rotate(-28 128 158)" opacity=".78"><path d="M128 78 C142 104 142 134 128 158 C114 134 114 104 128 78 Z" fill="url(#hp)"/></g>
      <g transform="rotate(28 128 158)" opacity=".78"><path d="M128 78 C142 104 142 134 128 158 C114 134 114 104 128 78 Z" fill="url(#hp)"/></g>
      <path d="M128 68 C144 96 144 130 128 158 C112 130 112 96 128 68 Z" fill="url(#hp)"/>
      <path d="M84 180 Q128 198 172 180" fill="none" stroke="#a5cbe8" stroke-width="3" stroke-linecap="round" opacity=".75"/>
      <path d="M97 194 Q128 206 159 194" fill="none" stroke="#a5cbe8" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
      <circle cx="128" cy="52" r="6" fill="#a5cbe8"/>
    </svg>
    <h1>PRANAVA</h1>
    <div class="eyebrow">Meditation Timer</div>
  </header>

  <div class="wrap">
    <div class="dial" id="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".3"/>
        <circle cx="100" cy="100" r="82" fill="none" stroke="currentColor" stroke-width=".6" opacity=".14"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="88" fill="none" stroke="#e9dcc6" stroke-width="2.2"
          stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="552.9" transform="rotate(-90 100 100)"/>
      </svg>
      <i class="ripple"></i><i class="ripple d2"></i><i class="ripple d3"></i>
    </div>
    <div class="center">
      <div class="time" id="time" role="timer" aria-live="off">15:00</div>
      <div class="state" id="state"></div>

  </div>

  <div class="chips" id="chips"></div>

  <div class="controls">
    <button class="soundsbtn" id="soundsbtn" aria-haspopup="dialog"><span class="dot">◎</span>Choose your sounds</button>
    <button class="begin" id="begin">Begin</button>
    <div class="run-row" id="run-row" hidden>
      <button class="ghost" id="pause">Pause</button>
      <button class="ghost" id="reset">End</button>
    </div>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Sound settings">
    <div class="panel" id="panel">
      <div class="grab"></div>
      <h2>Sounds</h2>
      <label class="row"><span>Sound</span><input type="checkbox" class="switch" id="sound" checked></label>
      <label class="row"><span>Opening sound</span>
        <select id="open">
          <option value="bowl">Singing Bowl</option><option value="gong">Gong</option>
          <option value="tingsha">Tingsha</option><option value="bell">Temple Bell</option><option value="none">None</option>
        </select>
      </label>
      <label class="row"><span>Background</span>
        <select id="amb">
          <option value="none">Silence</option><option value="rain">Rain</option>
          <option value="ocean">Ocean Waves</option><option value="forest">Forest Birdsong</option>
          <option value="stream">Mountain Stream</option><option value="storm">Sea Storm</option>
          <option value="soundbath">Sound Bath</option>
        </select>
      </label>
      <label class="row"><span>Closing sound</span>
        <select id="close">
          <option value="gong">Gong</option><option value="bowl">Singing Bowl</option>
          <option value="tingsha">Tingsha</option><option value="bell">Temple Bell</option><option value="none">None</option>
        </select>
      </label>
      <label class="row"><span>Interval</span>
        <select id="interval">
          <option value="0">Off</option><option value="5">Every 5 min</option>
          <option value="10">Every 10 min</option><option value="15">Every 15 min</option>
        </select>
      </label>
      <label class="row"><span>Bell volume<small>opening · closing · interval</small></span>
        <input type="range" id="bellvol" min="0" max="100" value="70" aria-label="Bell volume">
      </label>
      <label class="row"><span>Background volume</span>
        <input type="range" id="vol" min="0" max="100" value="55" aria-label="Background volume">
      </label>
      <button class="donebtn" id="done">Done</button>
    </div>
  </div>

  <footer>
    <svg viewBox="0 0 600 600" aria-hidden="true">
      <defs>
        <linearGradient id="fl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7A5018"/><stop offset="45%" stop-color="#D8A858"/><stop offset="55%" stop-color="#D8A858"/><stop offset="100%" stop-color="#7A5018"/></linearGradient>
        <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#5A3408"/><stop offset="15%" stop-color="#B07828"/><stop offset="45%" stop-color="#D8A858"/><stop offset="70%" stop-color="#9A6820"/><stop offset="100%" stop-color="#4A2808"/></linearGradient>
        <radialGradient id="pl" cx="38%" cy="32%" r="62%"><stop offset="0%" stop-color="#E8C070"/><stop offset="100%" stop-color="#7A5018"/></radialGradient>
        <radialGradient id="sn" cx="36%" cy="30%" r="65%"><stop offset="0%" stop-color="#F0D080"/><stop offset="100%" stop-color="#9A6820"/></radialGradient>
      </defs>
      <rect x="158" y="528" width="284" height="12" rx="2" fill="url(#fl)"/><rect x="177" y="515" width="246" height="12" rx="2" fill="url(#fl)"/>
      <path d="M186,515 L193,395 L207,395 L214,515 Z" fill="url(#sh)"/><path d="M236,515 L243,395 L257,395 L264,515 Z" fill="url(#sh)"/><path d="M286,515 L293,395 L307,395 L314,515 Z" fill="url(#sh)"/><path d="M336,515 L343,395 L357,395 L364,515 Z" fill="url(#sh)"/><path d="M386,515 L393,395 L407,395 L414,515 Z" fill="url(#sh)"/>
      <rect x="158" y="383" width="284" height="12" rx="2" fill="url(#fl)"/><rect x="177" y="370" width="246" height="12" rx="2" fill="url(#fl)"/><rect x="194" y="357" width="212" height="12" rx="2" fill="url(#fl)"/>
      <ellipse cx="300" cy="271" rx="78" ry="30" fill="none" stroke="#C09040" stroke-width="3.5"/><ellipse cx="300" cy="271" rx="78" ry="30" fill="none" stroke="#C09040" stroke-width="3.5" transform="rotate(60 300 271)"/><ellipse cx="300" cy="271" rx="78" ry="30" fill="none" stroke="#C09040" stroke-width="3.5" transform="rotate(-60 300 271)"/>
      <circle cx="300" cy="271" r="18" fill="url(#sn)"/><circle cx="378" cy="271" r="9" fill="url(#pl)"/><circle cx="261" cy="203" r="7" fill="url(#pl)"/><circle cx="339" cy="203" r="5" fill="url(#pl)"/>
    </svg>
    <span>by Kathmandu Meditates™<br>Powered by <b>GIRI</b></span>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s);};

  /* living Flower of Life behind everything (exact Pranava geometry) */
  (function(){
    var size=640,R=size/6.5,cx=size/2,cy=size/2,k=Math.sqrt(3)/2,out=[];
    for(var q=-2;q<=2;q++)for(var r=-2;r<=2;r++){ if(Math.abs(q+r)>2)continue;
      out.push('<circle cx="'+(cx+R*(q+r/2)).toFixed(1)+'" cy="'+(cy+R*r*k).toFixed(1)+'" r="'+R.toFixed(1)+'"/>'); }
    $('#bg-flower').innerHTML='<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg">'+
      '<g fill="none" stroke="currentColor" stroke-width="1" opacity=".85">'+out.join('')+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*3)+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(R*3+5)+'" opacity=".35"/></g></svg>';
  })();

  var C=2*Math.PI*88;
  var prog=$('#prog'), timeEl=$('#time'), stateEl=$('#state'), dial=$('#dial');
  var beginBtn=$('#begin'), runRow=$('#run-row'), pauseBtn=$('#pause'), resetBtn=$('#reset');
  var soundToggle=$('#sound'), intervalSel=$('#interval'),
      openSel=$('#open'), closeSel=$('#close'), ambSel=$('#amb'),
      volSlider=$('#vol'), bellVolSlider=$('#bellvol');
  var sheet=$('#sheet'), soundsBtn=$('#soundsbtn'), doneBtn=$('#done'), panel=$('#panel');

  var durationMin=15, totalSec=900, remaining=900, running=false, paused=false, tick=null, endAt=0, lastBell=0;

  function fmt(s){ s=Math.max(0,Math.round(s)); var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }
  function setProg(frac){ prog.style.strokeDashoffset = C*(1-Math.min(1,Math.max(0,frac))); }

  /* ——— synthesized bowl / gong / bell (432 Hz family) ——— */
  var AC=null;
  function ctx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(AC && AC.state==='suspended'){ try{AC.resume();}catch(e){} } return AC; }
  function bellVol(){ var v=(+bellVolSlider.value||0)/100; return v*v; }   /* perceptual (squared) curve */
  function strike(parts, peak){
    if(!soundToggle.checked) return;
    var c=ctx(); if(!c) return;
    var now=c.currentTime, master=c.createGain(); master.gain.value=peak*bellVol(); master.connect(c.destination);
    parts.forEach(function(p){ var f=p[0],g=p[1],d=p[2];
      var o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      var ga=c.createGain(); ga.gain.setValueAtTime(0.0001,now); ga.gain.linearRampToValueAtTime(g,now+0.02);
      ga.gain.exponentialRampToValueAtTime(0.0001,now+d);
      o.connect(ga); ga.connect(master); o.start(now); o.stop(now+d+0.1);
    });
  }
  var voices={
    bowl:{p:[[432,1,4],[432*2.76,0.22,3],[432*5.4,0.08,2]],g:0.5},     /* warm singing bowl, 432 Hz */
    gong:{p:[[108,1,6],[162,0.5,5.5],[216,0.4,5],[432,0.12,3]],g:0.55},/* deep temple gong */
    tingsha:{p:[[864,0.7,1.6],[1297,0.25,1.2]],g:0.4},                 /* bright tingsha chime */
    bell:{p:[[528,1,3],[1056,0.3,2.4],[1589,0.15,1.8],[2218,0.08,1.2]],g:0.45} /* clear temple bell */
  };
  function play(name){ if(!name||name==='none') return; var v=voices[name]||voices.bowl; strike(v.p,v.g); }
  function closing(){ play(closeSel.value); setTimeout(function(){ play(closeSel.value); },2300); } /* two gentle swells so a low volume is never missed */

  /* ——— background ambience: real CC0 recordings from /sounds, live volume ——— */
  var AMB={ rain:'sounds/rain.mp3', ocean:'sounds/beach.mp3', forest:'sounds/birds.mp3',
            stream:'sounds/stream.mp3', storm:'sounds/storm.mp3', soundbath:'sounds/soundbath.mp3' };
  var ambAudio=new Audio(); ambAudio.loop=true; ambAudio.preload='none';
  function volGain(){ var v=(+volSlider.value||0)/100; return Math.min(1,v*v); } /* perceptual (squared) curve */
  /* start / switch / stop the background by current selection + the Sound toggle */
  function applyAmb(){
    var name=ambSel.value, file=AMB[name];
    if(!file || !soundToggle.checked){ ambAudio.pause(); return; }
    if(ambAudio.getAttribute('data-id')!==name){ ambAudio.src=file; ambAudio.setAttribute('data-id',name); }
    ambAudio.volume=volGain();
    var p=ambAudio.play(); if(p && p.catch) p.catch(function(){});
  }
  function stopAmb(){ ambAudio.pause(); try{ ambAudio.currentTime=0; }catch(e){} }
  function setVol(){ ambAudio.volume=volGain(); }

  /* ——— wake lock while running ——— */
  var wake=null;
  function lock(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){}); }catch(e){} }
  function unlock(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }

  /* ——— duration chips ——— */
  var values=[5,10,15,20,30,45];
  var chipsEl=$('#chips');
  function renderChips(){
    chipsEl.innerHTML='';
    values.forEach(function(v){
      var b=document.createElement('button'); b.className='chip'+(v===durationMin?' active':'');
      b.innerHTML=v+'<small>min</small>'; b.setAttribute('aria-pressed',v===durationMin?'true':'false');
      b.onclick=function(){ setDuration(v); };
      chipsEl.appendChild(b);
    });
    var custom=values.indexOf(durationMin)<0;
    var pencil=document.createElement('button'); pencil.className='chip'+(custom?' active':'');
    pencil.innerHTML=custom?(durationMin+'<small>min</small>'):'✎';
    pencil.title='Custom minutes';
    pencil.onclick=function(){
      var inp=document.createElement('input'); inp.type='number'; inp.min='1'; inp.max='180'; inp.className='chip-input';
      inp.value=custom?durationMin:25; chipsEl.replaceChild(inp,pencil); inp.focus(); inp.select();
      function commit(){ var n=Math.min(180,Math.max(1,Math.round(+inp.value||25))); setDuration(n); }
      inp.onblur=commit; inp.onkeydown=function(e){ if(e.key==='Enter') inp.blur(); };
    };
    chipsEl.appendChild(pencil);
  }
  function setDuration(v){
    if(running) return;
    durationMin=v; totalSec=remaining=v*60; timeEl.textContent=fmt(remaining); setProg(0); renderChips();
  }

  /* ——— timer loop ——— */
  function loop(){
    var now=Date.now(); remaining=(endAt-now)/1000;
    if(remaining<=0){ remaining=0; finish(); return; }
    timeEl.textContent=fmt(remaining);
    setProg((totalSec-remaining)/totalSec);
    var every=+intervalSel.value;
    if(every>0){ var elapsed=totalSec-remaining; var mark=Math.floor(elapsed/ (every*60));
      if(mark>lastBell && remaining>2){ lastBell=mark; play('tingsha'); } } /* interval chime fixed to tingsha */
  }
  function begin(){
    totalSec=remaining=durationMin*60; lastBell=0;
    running=true; paused=false; endAt=Date.now()+remaining*1000;
    beginBtn.hidden=true; runRow.hidden=false; pauseBtn.textContent='Pause';
    stateEl.textContent='Breathe'; dial.classList.add('breathe');
    timeEl.setAttribute('aria-live','off');
    ctx(); play(openSel.value); applyAmb(); lock();
    tick=setInterval(loop,250); loop();
  }
  function pause(){
    if(!running) return;
    if(!paused){ paused=true; clearInterval(tick); tick=null; stateEl.textContent='Paused';
      dial.classList.remove('breathe'); pauseBtn.textContent='Resume'; ambAudio.pause(); unlock(); }
    else { paused=false; endAt=Date.now()+remaining*1000; stateEl.textContent='Breathe';
      dial.classList.add('breathe'); pauseBtn.textContent='Pause'; applyAmb(); lock(); tick=setInterval(loop,250); loop(); }
  }
  function stop(){
    running=false; paused=false; if(tick){clearInterval(tick);tick=null;} stopAmb(); unlock();
    dial.classList.remove('breathe'); beginBtn.hidden=false; runRow.hidden=true;
  }
  function reset(){
    stop(); remaining=totalSec=durationMin*60; timeEl.textContent=fmt(remaining); setProg(0); stateEl.textContent='';
  }
  function finish(){
    stop(); setProg(1); timeEl.textContent='0:00'; stateEl.textContent='Complete'; closing();
    setTimeout(function(){ remaining=totalSec=durationMin*60; timeEl.textContent=fmt(remaining); setProg(0);
      if(!running) stateEl.textContent=''; },6000);
  }

  beginBtn.onclick=begin; pauseBtn.onclick=pause; resetBtn.onclick=reset;
  openSel.onchange=function(){ ctx(); play(openSel.value); };       /* preview on pick */
  closeSel.onchange=function(){ ctx(); play(closeSel.value); };
  bellVolSlider.onchange=function(){ ctx(); play(openSel.value); }; /* preview bell at the new volume (on release) */
  ambSel.onchange=function(){ ctx(); applyAmb(); };                 /* play background now so volume can be set, continues into session */
  volSlider.oninput=setVol;                                         /* live background volume — setup and during the session */
  soundToggle.onchange=applyAmb;                                    /* Sound on/off mutes background + bells live, mid-session too */

  /* sounds sheet open / close (slides over the timer so the main screen never scrolls) */
  function openSheet(){ ctx(); sheet.classList.add('show'); }
  function closeSheet(){ sheet.classList.remove('show'); }
  soundsBtn.onclick=openSheet;
  doneBtn.onclick=closeSheet;
  sheet.addEventListener('click',function(e){ if(e.target===sheet) closeSheet(); }); /* tap the dim backdrop */
  panel.addEventListener('click',function(e){ e.stopPropagation(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

  /* remember the viewer's choices between visits (per-browser) */
  var CTRLS=[soundToggle,openSel,closeSel,bellVolSlider,intervalSel,ambSel,volSlider];
  function saveCfg(){ try{ var o={}; CTRLS.forEach(function(el){ o[el.id]=el.type==='checkbox'?el.checked:el.value; });
    localStorage.setItem('pranava.km',JSON.stringify(o)); }catch(e){} }
  (function loadCfg(){ try{ var o=JSON.parse(localStorage.getItem('pranava.km')||'{}');
    CTRLS.forEach(function(el){ if(o[el.id]!==undefined){ if(el.type==='checkbox') el.checked=o[el.id]; else el.value=o[el.id]; } }); }catch(e){} })();
  CTRLS.forEach(function(el){ el.addEventListener('change',saveCfg); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && running && !paused) loop(); });

  renderChips(); setDuration(15);
})();
</script>
